<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep agent + sandbox</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1419; --panel: #1a2332; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --ok: #3fb950; --err: #f85149; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #30363d; background: var(--panel); }
    h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    p.sub { margin: 0.35rem 0 0; font-size: 0.85rem; color: var(--muted); }
    main { max-width: 960px; margin: 0 auto; padding: 1rem 1.25rem 2rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    textarea { width: 100%; min-height: 140px; padding: 0.75rem; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: var(--text); font-size: 0.9rem; resize: vertical; }
    .row { display: flex; gap: 0.75rem; align-items: center; margin-top: 0.75rem; flex-wrap: wrap; }
    button { background: var(--accent); color: #0d1117; border: none; padding: 0.55rem 1.1rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #sandboxId { font-size: 0.8rem; color: var(--ok); }
    #log { margin-top: 1rem; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 0.75rem; min-height: 320px; max-height: 60vh; overflow: auto; font-family: ui-monospace, monospace; font-size: 0.78rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .line { border-bottom: 1px solid #21262d; padding: 0.35rem 0; }
    .line:last-child { border-bottom: none; }
    .kind-status { color: var(--muted); }
    .kind-graph { color: #79c0ff; }
    .kind-update { color: #d2a8ff; }
    .kind-error { color: var(--err); }
    .kind-done { color: var(--ok); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>Deep agent · sandbox</h1>
    <p class="sub">Streams LangGraph v3 <code>messages</code>/<code>values</code> (see <code>kind: stream</code>) plus <code>final</code> tail. One run at a time.</p>
  </header>
  <main>
    <label for="task">Task</label>
    <textarea id="task" placeholder="e.g. Write /tmp/hello.txt with one line 'hi' then run cat /tmp/hello.txt via execute."></textarea>
    <div class="row">
      <button id="send" type="button">Run</button>
      <span id="sandboxId"></span>
    </div>
    <div id="log"></div>
  </main>
  <script>
    const taskEl = document.getElementById('task');
    const sendBtn = document.getElementById('send');
    const logEl = document.getElementById('log');
    const sandboxEl = document.getElementById('sandboxId');

    function append(kind, obj) {
      const div = document.createElement('div');
      div.className = 'line kind-' + (kind || 'raw');
      div.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    sendBtn.addEventListener('click', async () => {
      const task = taskEl.value.trim();
      if (!task) return;
      sendBtn.disabled = true;
      sandboxEl.textContent = '';
      logEl.innerHTML = '';
      append('status', { message: 'Connecting…' });

      try {
        const res = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ task }),
        });
        if (!res.ok) {
          append('error', { http: res.status, text: await res.text() });
          return;
        }
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const block = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const lines = block.split('\n');
            for (const line of lines) {
              if (!line.startsWith('data:')) continue;
              const raw = line.slice(5).trim();
              let msg;
              try { msg = JSON.parse(raw); } catch { append('error', raw); continue; }
              if (msg.kind === 'sandbox') {
                sandboxEl.textContent = 'sandbox_id: ' + msg.sandbox_id;
              }
              append(msg.kind || 'raw', msg);
            }
          }
        }
      } catch (e) {
        append('error', String(e));
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
